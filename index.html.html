<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minhas Receitas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8f2;color:#3d2b24}
header{background:linear-gradient(135deg,#d96c45,#f0a35b);color:#fff;text-align:center;padding:28px 16px}
header h1{margin:0 0 7px;font-size:34px}header p{margin:0}
main{max-width:1050px;margin:24px auto;padding:0 16px}.box{background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 18px #0001;margin-bottom:20px}
h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea,button{font:inherit}input,select,textarea{border:1px solid #dfcec2;border-radius:10px;padding:11px;background:#fff}
textarea{width:100%;min-height:100px;resize:vertical}.full{grid-column:1/-1}
button{border:0;border-radius:10px;padding:11px 16px;background:#d96c45;color:#fff;font-weight:bold;cursor:pointer}
button.sec{background:#ead9ce;color:#5a4034}.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;margin-bottom:20px}.toolbar input{flex:1}
#lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px #0001}.card h3{margin:5px 0 10px;color:#bd5737}
.tag{display:inline-block;background:#fff0e5;color:#a64e32;padding:5px 9px;border-radius:20px;font-size:12px}
.card p{white-space:pre-line;line-height:1.5}.btns{display:flex;gap:8px;margin-top:14px}
.status{text-align:center;margin:10px 0;color:#6c5a50}.empty{text-align:center;padding:35px;background:#fff;border-radius:16px;color:#8b756b}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{flex-direction:column}header h1{font-size:28px}}
</style>
</head>
<body>
<header><h1>🍳 Minhas Receitas</h1><p>Suas receitas salvas online e acessíveis em qualquer aparelho.</p></header>
<main>
<section class="box">
<h2>➕ Adicionar receita</h2>
<div class="grid">
<input id="nome" placeholder="Nome da receita">
<select id="categoria"><option>Café da manhã</option><option>Almoço</option><option>Jantar</option><option>Sobremesa</option><option>Lanche</option><option>Bebida</option><option>Outros</option></select>
<textarea id="ingredientes" class="full" placeholder="Ingredientes"></textarea>
<textarea id="modo" class="full" placeholder="Modo de preparo"></textarea>
</div>
<div class="actions">
<button onclick="salvar()">Salvar receita</button>
<button class="sec" onclick="cancelar()" id="cancelar" style="display:none">Cancelar edição</button>
</div>
<div class="status" id="status">Carregando receitas...</div>
</section>

<div class="toolbar">
<input id="busca" placeholder="🔎 Pesquisar receita..." oninput="mostrar()">
<select id="filtro" onchange="mostrar()"><option value="">Todas as categorias</option><option>Café da manhã</option><option>Almoço</option><option>Jantar</option><option>Sobremesa</option><option>Lanche</option><option>Bebida</option><option>Outros</option></select>
</div>
<section id="lista"></section>
</main>

<script>
let receitas=[], editando=null;
const $=id=>document.getElementById(id);
function carregar(){
 google.script.run.withSuccessHandler(d=>{receitas=d||[];$("status").textContent="✓ Receitas sincronizadas";mostrar()})
 .withFailureHandler(e=>{$("status").textContent="Erro ao carregar: "+e.message}).listarReceitas();
}
function salvar(){
 const r={nome:$("nome").value.trim(),categoria:$("categoria").value,ingredientes:$("ingredientes").value.trim(),modo:$("modo").value.trim()};
 if(!r.nome||!r.ingredientes||!r.modo){alert("Preencha todos os campos.");return}
 $("status").textContent="Salvando...";
 if(editando){
  r.id=editando;
  google.script.run.withSuccessHandler(()=>{finalizar();carregar()}).withFailureHandler(e=>alert(e.message)).editarReceita(r);
 }else{
  google.script.run.withSuccessHandler(()=>{limpar();carregar()}).withFailureHandler(e=>alert(e.message)).adicionarReceita(r);
 }
}
function editar(id){
 const r=receitas.find(x=>x.id===id);if(!r)return;
 $("nome").value=r.nome;$("categoria").value=r.categoria;$("ingredientes").value=r.ingredientes;$("modo").value=r.modo;
 editando=id;$("cancelar").style.display="inline-block";scrollTo({top:0,behavior:"smooth"});
}
function excluir(id){
 if(!confirm("Excluir esta receita?"))return;
 google.script.run.withSuccessHandler(carregar).withFailureHandler(e=>alert(e.message)).excluirReceita(id);
}
function limpar(){["nome","ingredientes","modo"].forEach(id=>$(id).value="");editando=null;$("cancelar").style.display="none"}
function cancelar(){limpar()}
function finalizar(){limpar()}
function esc(t){return String(t).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function mostrar(){
 const b=$("busca").value.toLowerCase(),f=$("filtro").value;
 const l=receitas.filter(r=>r.nome.toLowerCase().includes(b)&&(!f||r.categoria===f));
 $("lista").innerHTML=l.length?l.map(r=>`<article class="card"><span class="tag">${esc(r.categoria)}</span><h3>${esc(r.nome)}</h3><p><b>Ingredientes:</b>\n${esc(r.ingredientes)}</p><p><b>Modo de preparo:</b>\n${esc(r.modo)}</p><div class="btns"><button onclick="editar('${r.id}')">✏️ Editar</button><button class="sec" onclick="excluir('${r.id}')">🗑️ Excluir</button></div></article>`).join(""):'<div class="empty">Nenhuma receita encontrada. 🍰</div>';
}
carregar();
</script>
</body>
</html>
